<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Turnado</title>
    <!-- __TURNADO_THEME_STORAGE_KEY__ is substituted with theme.ts's real
         STORAGE_KEY by viteThemeStoragePlugin.ts's injectThemeStorageKey. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("__TURNADO_THEME_STORAGE_KEY__");
          document.documentElement.dataset.theme = stored === "dark" ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
